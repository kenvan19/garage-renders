<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage Renders</title>
<style>
  :root{
    --bg:#14110e; --panel:#1d1916; --panel2:#241f1a; --line:#332b22;
    --ink:#f3ece2; --muted:#a89683; --bronze:#b5853a; --bronze-bright:#d9a24e;
    --bad:#c2562f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1d1916,#1d1916f5);
    border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px}
  .title{font-weight:700;letter-spacing:.3px;color:var(--bronze-bright);margin-right:4px}
  .title b{color:var(--ink)}
  .count{color:var(--muted);font-size:13px}
  input,select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:14px;outline:none}
  input:focus,select:focus{border-color:var(--bronze)}
  #q{min-width:220px;flex:1}
  .chip{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--muted);
    padding:6px 11px;border-radius:999px;font-size:13px}
  .chip.on{color:#1a1410;background:var(--bronze);border-color:var(--bronze);font-weight:600}
  .wrap{padding:16px;max-width:1600px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    transition:transform .08s ease,border-color .12s ease}
  .card:hover{transform:translateY(-2px);border-color:var(--bronze)}
  .thumb{aspect-ratio:4/3;background:#0e0c0a;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ph{color:#4a4036;font-size:12px;text-align:center;padding:8px}
  .meta{padding:9px 11px}
  .mk{font-weight:600;font-size:14px}
  .mk .yr{color:var(--bronze-bright);font-weight:500}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
    padding:2px 7px;border-radius:6px}
  .flag{position:absolute;}
  .card.bad{border-color:var(--bad)}
  .card.bad .thumb{outline:2px solid var(--bad);outline-offset:-2px}
  .issues{background:#2a1812;border:1px solid var(--bad);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .issues h3{margin:0 0 6px;color:var(--bad);font-size:14px}
  .issues code{color:#e7b9a6;font-size:12px}
  .issues ul{margin:6px 0 0;padding-left:18px}
  .empty{color:var(--muted);padding:40px;text-align:center}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:24px}
  /* lightbox */
  #lb{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  #lb.on{display:flex}
  #lb img{max-width:92vw;max-height:82vh;border-radius:8px}
  #lb .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#eee;font-size:14px}
  #lb .x{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;line-height:1}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="title"><b>Garage</b> Renders</span>
    <span class="count" id="count">1828 shown</span>
    <input id="q" placeholder="Search make, model, name, year…">
    <select id="f-make"><option value="">All makes</option></select>
    <select id="f-type"><option value="">All types</option></select>
    <select id="f-body"><option value="">All bodies</option></select>
    <select id="f-family"><option value="">All families</option></select>
    <select id="f-decade"><option value="">All decades</option></select>
    <span class="chip" id="toggle-bad" title="Show only entries that didn't parse cleanly">⚠ Issues (4)</span>
  </div>
</header>

<div class="wrap">
  <div id="issues-panel"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No renders match these filters.</div>
</div>
<footer>1832 renders · sorted by filename · static gallery, no server</footer>

<div id="lb"><span class="x" id="lb-x">×</span><img id="lb-img" src=""><div class="cap" id="lb-cap"></div></div>

", "wheels": "WDMBD-", "ok": true, "issues": "", "thumb": "thumbs/c837f32c.jpg", "full": "thumbs/c837f32c.jpg"}];
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const fMake=document.getElementById('f-make'), fType=document.getElementById('f-type'),
      fBody=document.getElementById('f-body'), fFamily=document.getElementById('f-family'),
      fDecade=document.getElementById('f-decade');
const countEl=document.getElementById('count');
let badOnly=false;

function uniq(key){return [...new Set(DATA.map(r=>r[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
function fill(sel,vals){vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});}
fill(fMake,uniq('make')); fill(fType,uniq('type')); fill(fBody,uniq('body')); fill(fFamily,uniq('family'));
const decades=[...new Set(DATA.map(r=>r.year&&r.year.length===4?r.year.slice(0,3)+'0s':null).filter(Boolean))].sort();
fill(fDecade,decades);

function matches(r){
  if(badOnly && r.ok) return false;
  if(fMake.value && r.make!==fMake.value) return false;
  if(fType.value && r.type!==fType.value) return false;
  if(fBody.value && r.body!==fBody.value) return false;
  if(fFamily.value && r.family!==fFamily.value) return false;
  if(fDecade.value){const d=r.year&&r.year.length===4?r.year.slice(0,3)+'0s':'';if(d!==fDecade.value)return false;}
  const t=q.value.trim().toLowerCase();
  if(t){const hay=[r.make,r.model,r.year,r.name,r.family,r.type,r.body].join(' ').toLowerCase();
    if(!hay.includes(t)) return false;}
  return true;
}

function card(r){
  const bad=r.ok?'':' bad';
  const yr=r.year?`<span class="yr">${r.year}</span>`:'';
  const thumb = r.thumb
    ? `<img loading="lazy" src="${r.thumb}" alt="">`
    : `<div class="ph">${r.filename}</div>`;
  const tags=[r.type,r.body,r.family].filter(Boolean).map(x=>`<span class="tag">${x}</span>`).join('');
  return `<div class="card${bad}" data-full="${r.thumb||''}" data-cap="${(r.make+' '+r.model+' '+r.year).trim()}">
    <div class="thumb">${thumb}</div>
    <div class="meta">
      <div class="mk">${r.make} ${r.model} ${yr}</div>
      <div class="sub">${[r.name,r.family].filter(Boolean).join(' · ')||'&nbsp;'}</div>
      <div class="tags">${tags}</div>
    </div></div>`;
}

function render(){
  const rows=DATA.filter(matches);
  grid.innerHTML=rows.map(card).join('');
  countEl.textContent=`${rows.length} shown`;
  document.getElementById('empty').style.display=rows.length?'none':'block';
}

// Issues panel
function renderIssues(){
  const bad=DATA.filter(r=>!r.ok);
  const p=document.getElementById('issues-panel');
  if(!bad.length){p.innerHTML='';return;}
  p.innerHTML=`<div class="issues"><h3>⚠ ${bad.length} filename(s) didn't parse cleanly</h3>
    <ul>${bad.slice(0,50).map(r=>`<li><code>${r.filename}</code> — ${r.issues}</li>`).join('')}</ul>
    ${bad.length>50?`<div style="margin-top:6px;color:var(--muted)">…and ${bad.length-50} more</div>`:''}</div>`;
}

[q,fMake,fType,fBody,fFamily,fDecade].forEach(el=>el.addEventListener('input',render));
document.getElementById('toggle-bad').addEventListener('click',e=>{
  badOnly=!badOnly;e.target.classList.toggle('on',badOnly);render();
});

// Lightbox
const lb=document.getElementById('lb'),lbImg=document.getElementById('lb-img'),lbCap=document.getElementById('lb-cap');
grid.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;
  const full=c.getAttribute('data-full');if(!full)return;
  lbImg.src=full;lbCap.textContent=c.getAttribute('data-cap');lb.classList.add('on');});
document.getElementById('lb-x').addEventListener('click',()=>lb.classList.remove('on'));
lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('on');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on');});

renderIssues();render();
</script>
